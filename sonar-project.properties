sonar.projectKey=alparimets_Aquarelle-Flow
sonar.organization=alparimets
sonar.projectName=Watercolor Creative Space
sonar.sources=src
sonar.inclusions=src/**/*.ts,src/**/*.tsx
sonar.exclusions=**/*.test.ts
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Coverage is measured for logic and data; React UI and bootstrap files are not unit tested.
sonar.coverage.exclusions=src/**/*.tsx,src/App.tsx,src/main.tsx
# Exercise content is static data, so structural repetition between entries is expected.
sonar.cpd.exclusions=src/data/**
