name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report missing SonarCloud token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SonarCloud analysis was skipped because SONAR_TOKEN is not configured."
      - uses: sonarsource/sonarcloud-github-action@v3
        if: ${{ env.SONAR_TOKEN != '' }}
